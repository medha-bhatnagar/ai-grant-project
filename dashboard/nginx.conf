server {
    # Only reachable from the VM itself; open it from your PC through an SSH tunnel.
    # ${DASHBOARD_PORT} and ${JUDGE_PORT} come from compose.yaml (defaults 8090 and 8010).
    listen 127.0.0.1:${DASHBOARD_PORT};
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Assistant chat: /api/chat goes to the Judge's /chat.
    location /api/ {
        proxy_pass http://127.0.0.1:${JUDGE_PORT}/;
        proxy_read_timeout 900s;   # local LLMs can take minutes on a CPU
    }
}
