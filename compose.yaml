# The whole app in one container. Settings come from the .env file (copy .env.example).
#   docker compose up -d --build      start (first time: a few minutes)
#   docker compose down               stop
#
# Its own project name, so it never replaces a teammate's containers. To run a second copy on the
# same machine, set COMPOSE_PROJECT_NAME and APP_PORT to something different in that copy's .env.
name: grant-assistant

services:
  app:
    build: .
    # Shares the VM's network so the Judge reaches the VM's MongoDB at localhost, like mongosh does.
    # It listens on 127.0.0.1 only: open it from your PC through an SSH tunnel.
    network_mode: host
    environment:
      APP_PORT: ${APP_PORT:-8000}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-demo}
      ALLOW_DEMO: ${ALLOW_DEMO:-1}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      CAS_SERVER_URL: ${CAS_SERVER_URL:-}
      OIDC_METADATA_URL: ${OIDC_METADATA_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_USER_CLAIM: ${OIDC_USER_CLAIM:-preferred_username}
      MONGO_DB: ${MONGO_DB:-grants}                          # the Judge's own database; never grant_rag
      MONGO_URL: ${MONGO_URL:-}                              # optional: a database address with a password
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}  # from `claude setup-token`, kept in .env
    volumes:
      - app_data:/app/data                    # sign-in sessions, collaboration documents and uploads
      - ./agents:/app/agents:ro               # add, remove or edit LLMs without rebuilding
      - ./people.json:/app/people.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
