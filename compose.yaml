# The whole system on the VM. See VM_CHANGES.md for setup and START_HERE.md for the PC.
# Its own project name, so it never replaces a teammate's containers.
name: colin-judge

# dashboard and judge share the VM's network so the Judge reaches the VM's MongoDB at
# localhost (like mongosh does). Everything listens on 127.0.0.1: use an SSH tunnel.
# Ports default to 8090 (website) and 8010 (judge) so they don't clash with anything on
# 8080/8000; change them in the .env file if those are taken too.
services:
  # Web UI on http://localhost:${DASHBOARD_PORT}. Its Assistant chat calls /api/chat -> the judge.
  dashboard:
    build: ./dashboard
    network_mode: host
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8090}
      JUDGE_PORT: ${JUDGE_PORT:-8010}
    depends_on: [judge]
    restart: unless-stopped

  # The Judge and the LLMs in the agents/ folder.
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    network_mode: host
    environment:
      JUDGE_PORT: ${JUDGE_PORT:-8010}
      MONGO_DB: ${MONGO_DB:-grants}                      # our own database; never grant_rag
      MONGO_URL: ${MONGO_URL:-}                          # optional: a database address with a password
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}  # from `claude setup-token`, kept in .env
    volumes:
      - ./agents:/app/agents:ro               # add, remove or edit LLMs without rebuilding
      - ./people.json:/app/people.json:ro
    restart: unless-stopped

  # Optional local LLMs (Ollama). Off unless you ask for it, because the VM may already run
  # Ollama on port 11434. Start it with:  docker compose --profile ollama up -d
  llm:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
